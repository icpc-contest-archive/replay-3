<div id="icpc-archive-banner"><b><a href="https://icpc-contest-archive.github.io/contests/">ICPC contest archive</a></b>
 archived copy of <a href="https://icpc.cs.sci.ku.ac.th/scoreboard/scoreboard-icpc-2026.html">https://icpc.cs.sci.ku.ac.th/scoreboard/scoreboard-icpc-2026.html</a> (live fetch 2026-11-23)  catalogue: <a href="https://icpc-contest-archive.github.io/contests/contest/thailand-national-2026.html">thailand-national-2026</a>  <a href="https://web.archive.org/web/*/https://icpc.cs.sci.ku.ac.th/scoreboard/scoreboard-icpc-2026.html">wayback</a>  <a href="https://icpc.cs.sci.ku.ac.th/scoreboard/scoreboard-icpc-2026.html">live</a></div>

    <div id="app" class="mt-3"></div>

    <script>
      "use strict";

      /* ==========================================================================

   CONFIG

   ========================================================================== */

      const CONFIG = {
        // relative path — ต้องอยู่โฟลเดอร์เดียวกับ scoreboard.json (ไฟล์นั้นไม่มี CORS header)

        jsonUrl: "scoreboard.json",

        demoJsonUrl: "demo-scoreboard.json",

        // bridge ดันไฟล์ใหม่ทุก 20 วิ ตั้งให้ตรงกัน

        refreshMs: 20000,
      };

      const QS = new URLSearchParams(location.search);

      /* --- บล็อก override สำหรับทดสอบ (ลบทิ้งได้ตอนขึ้น production) --- */

      if (QS.get("json")) CONFIG.jsonUrl = QS.get("json");

      if (QS.get("refresh"))
        CONFIG.refreshMs = Math.max(5000, +QS.get("refresh") * 1000);

      /* --- จบบล็อก override --- */

      const DEMO = QS.get("demo") === "1";

      /* ==========================================================================

   ก้อนที่ 1 — fetch: รู้จัก HTTP อย่างเดียว

   เปลี่ยนแหล่งข้อมูลเมื่อไหร่ แก้แค่ฟังก์ชันนี้ ก้อนอื่นไม่ต้องแตะ

   ========================================================================== */

      async function fetchScoreboard() {
        let res;

        let url = CONFIG.jsonUrl;

        if (DEMO) {
          url = CONFIG.demoJsonUrl;
        }

        try {
          // ไฟล์ส่งมาพร้อม Cache-Control: no-store อยู่แล้ว แต่ต่อ ?t= กัน proxy ชั้นกลาง

          res = await fetch(`${url}?t=${Date.now()}`, {
            cache: "no-store",
          });
        } catch (e) {
          throw new Error(
            `โหลด ${url} ไม่ได้ — เซิร์ฟเวอร์ไม่ตอบ หรือถูก CORS บล็อก ` +
              `(ไฟล์นี้ต้องอยู่โฟลเดอร์เดียวกับ scoreboard.json)`,
          );
        }

        if (!res.ok) {
          if (res.status === 404)
            throw new Error(
              `ไม่พบ ${url} (HTTP 404) — bridge ยังไม่ได้ส่งไฟล์ขึ้นมา?`,
            );

          throw new Error(`${url} ตอบกลับ HTTP ${res.status}`);
        }

        try {
          return await res.json();
        } catch (e) {
          throw new Error(
            `${url} ไม่ใช่ JSON ที่อ่านได้ — bridge อาจเขียนไฟล์ค้างกลางคัน`,
          );
        }
      }

      /* ==========================================================================

   ก้อนที่ 2 — สี: พอร์ตจาก Utils.php ของ DOMjudge ตรงตัว

   ========================================================================== */

      function parseHexColor(hex) {
        let h = String(hex || "")
          .trim()

          .replace(/^#/, "");

        if (h.length === 3)
          h = h

            .split("")

            .map((c) => c + c)

            .join("");

        if (!/^[0-9a-f]{6}$/i.test(h)) return [255, 255, 255];

        return [
          parseInt(h.slice(0, 2), 16),

          parseInt(h.slice(2, 4), 16),

          parseInt(h.slice(4, 6), 16),
        ];
      }

      function rgbToHex([r, g, b]) {
        return (
          "#" +
          [r, g, b]

            .map((v) =>
              Math.max(0, Math.min(255, v | 0))

                .toString(16)

                .padStart(2, "0"),
            )

            .join("")
        );
      }

      function normalizeHex(v) {
        if (!v) return null;

        const s = String(v).trim();

        if (/^#?[0-9a-f]{3}$/i.test(s) || /^#?[0-9a-f]{6}$/i.test(s))
          return rgbToHex(parseHexColor(s));

        return null;
      }

      /** Utils::relativeLuminance() — เลขชี้กำลัง 2.4 ตรงตามของเดิม */

      function relativeLuminance(hex) {
        const [r, g, b] = parseHexColor(hex);

        return (
          0.2126 * (r / 255) ** 2.4 +
          0.7152 * (g / 255) ** 2.4 +
          0.0722 * (b / 255) ** 2.4
        );
      }

      /** Utils::apcaContrast() — WCAG 3.x */

      function apcaContrast(fgColor, bgColor) {
        const lf = relativeLuminance(fgColor);

        const lb = relativeLuminance(bgColor);

        const contrast =
          lb > lf
            ? (lb ** 0.56 - lf ** 0.57) * 1.14
            : (lb ** 0.65 - lf ** 0.62) * 1.14;

        return Math.round(contrast * 10000) / 100;
      }

      /** Utils::hexToForegroundAndBorder() */

      function hexToForegroundAndBorder(rgb) {
        const bg = parseHexColor(rgb);

        const border = rgbToHex([
          Math.max(bg[0] - 64, 0),

          Math.max(bg[1] - 64, 0),

          Math.max(bg[2] - 64, 0),
        ]);

        const foreground =
          Math.abs(apcaContrast("#000000", rgb)) >
          Math.abs(apcaContrast("#ffffff", rgb))
            ? "#000000"
            : "#ffffff";

        return [foreground, border];
      }

      /** TwigExtension::problemBadge() */

      function problemBadge(label, rgb, grayedOut) {
        if (grayedOut) {
          return (
            `<span class="badge problem-badge" style="background-color: whitesmoke; border: 1px solid linen">` +
            `<span style="color: silver;">${esc(label || "?")}</span></span>`
          );
        }

        const color = normalizeHex(rgb) || "#ffffff";

        const [fg, border] = hexToForegroundAndBorder(color);

        return (
          `<span class="badge problem-badge" style="background-color: ${color}; border: 1px solid ${border}">` +
          `<span style="color: ${fg};">${esc(label || "?")}</span></span>`
        );
      }

      /* ==========================================================================

   ก้อนที่ 3 — normalize(): raw JSON เข้า view model ออก ไม่แตะ DOM เลย

   ทดสอบก้อนนี้ได้โดยไม่ต้องมี browser



   schema ของ scoreboard-bridge (ไม่ใช่ ICPC Contest API):

     { updated, frozen, started, finalized, time,

       contest: { name, start, duration "HH:MM:SS.mmm", freeze "HH:MM:SS.mmm" },

       problems: [ { id, label, name, color } ],

       rows: [ { rank, team_id, name, org, logo, solved, time,

                 problems: [ { label, solved, num_judged, pending, first, time } ] } ] }

   ========================================================================== */

      function normalize(d) {
        const problems = (d.problems || []).map((p) => ({
          id: String(p.id ?? p.label ?? ""),

          label: p.label ?? "?",

          name: p.name ?? "",

          rgb: normalizeHex(p.color) || "#ffffff",
        }));

        const byLabel = new Map(problems.map((p, i) => [p.label, i]));

        const rows = (d.rows || []).map((r) => {
          return {
            rank: r.rank,

            teamId: String(r.team_id ?? ""),

            teamName: r.name || `team ${r.team_id}`,

            orgName: r.org || "",

            logoHref: r.logo ? `logos/${encodeURIComponent(r.logo)}` : null,

            numSolved: r.solved ?? 0,

            totalTime: r.time ?? "",

            cells: buildCells(r.problems || [], problems.length, byLabel),
          };
        });

        return {
          contestName: (d.contest && d.contest.name) || "Scoreboard",

          frozen: d.frozen,

          timerText: contestTimerText(d),

          updated: d.updated || null,

          raw: d,

          problems,

          rows,

          summary: buildSummary(rows, problems.length),
        };
      }

      /**

       * _problem_cell.html.twig + Scoreboard::getCellCssClass() สาขา pass-fail

       * เซลล์ที่ยังไม่มี submission ต้องคืน hasSubmissions=false เพื่อให้ td ว่างสนิท

       * (twig: {% if numSubmissions != '0' %} → ไม่มี div.score_neutral อยู่ในตาราง)

       */

      function buildCells(rowProblems, numProblems, byLabel) {
        const cells = Array.from({ length: numProblems }, () => ({
          hasSubmissions: false,

          cssClass: "",

          text: "",

          tries: "",

          judged: 0,

          pending: 0,

          time: null,
        }));

        for (const p of rowProblems) {
          const idx = byLabel.get(p.label);

          if (idx === undefined) continue;

          const judged = p.num_judged ?? 0;

          const pending = p.pending ?? 0;

          const solved = p.solved === true;

          if (judged === 0 && pending === 0) continue; // td ต้องว่างสนิท

          let cssClass;

          if (solved)
            cssClass =
              p.first === true ? "score_correct score_first" : "score_correct";
          else if (pending) cssClass = "score_pending";
          else cssClass = "score_incorrect";

          // twig: numSubmissions แล้วต่อ " + pending" ถ้ามี

          const n = pending > 0 ? `${judged} + ${pending}` : `${judged}`;

          cells[idx] = {
            hasSubmissions: true,

            cssClass,

            text: solved ? String(p.time ?? "") : "&nbsp;",

            tries: judged === 1 && pending === 0 ? "1 try" : `${n} tries`,

            judged,

            pending,

            time: solved && p.time != null ? p.time : null,
          };
        }

        return cells;
      }

      /** _scoreboard_summary.html.twig — คำนวณจาก rows ทั้งหมด ไม่ต้องขอข้อมูลเพิ่ม */

      function buildSummary(rows, numProblems) {
        const perProblem = Array.from({ length: numProblems }, () => ({
          accepted: 0,

          rejected: 0,

          pending: 0,

          bestTime: null,
        }));

        let totalSolved = 0;

        for (const row of rows) {
          totalSolved += row.numSolved;

          row.cells.forEach((cell, i) => {
            if (!cell.hasSubmissions) return;

            const s = perProblem[i];

            s.pending += cell.pending;

            if (cell.cssClass.startsWith("score_correct")) {
              s.accepted++;

              s.rejected += Math.max(0, cell.judged - 1); // ครั้งที่ผ่านไม่นับเป็น rejected

              if (
                cell.time !== null &&
                (s.bestTime === null || cell.time < s.bestTime)
              ) {
                s.bestTime = cell.time;
              }
            } else {
              s.rejected += cell.judged;
            }
          });
        }

        return { totalSolved, perProblem };
      }

      /** partials/scoreboard.html.twig — ลำดับเงื่อนไขของ #contesttimer */

      function contestTimerText(d) {
        const c = d.contest || {};

        const start = c.start ? new Date(c.start) : null;

        const durMs = hmsToMs(c.duration);

        const end =
          start && durMs !== null ? new Date(start.getTime() + durMs) : null;

        if (d.finalized) return "final standings";

        if (end && Date.now() > end.getTime())
          return "contest over, waiting for results";

        if (!start) return "";

        // twig: {% if freezeData.started %}started:{% else %}starts:{% endif %}

        //       {{ starttime|printtime }} - ends: {{ endtime|printtime }}

        const verb = d.started ? "started" : "starts";

        return end
          ? `${verb}: ${hhmm(start)} - ends: ${hhmm(end)}`
          : `${verb}: ${hhmm(start)}`;
      }

      /** "20:00:00.000" → มิลลิวินาที */

      function hmsToMs(s) {
        const m = /^(\d+):(\d{2}):(\d{2})(?:\.(\d+))?$/.exec(String(s || ""));

        if (!m) return null;

        return (
          (+m[1] * 3600 + +m[2] * 60 + +m[3]) * 1000 +
          (m[4] ? +m[4].padEnd(3, "0") : 0)
        );
      }

      function hhmm(d) {
        const dt = d instanceof Date ? d : new Date(d);

        if (Number.isNaN(dt.getTime())) return String(d);

        return `${String(dt.getHours()).padStart(2, "0")}:${String(dt.getMinutes()).padStart(2, "0")}`;
      }

        q: "M256 8C119 8 8 119 8 256S119 504 256 504 504 393 504 256 393 8 256 8zm0 448c-110.5 0-200-89.5-200-200S145.5 56 256 56s200 89.5 200 200-89.5 200-200 200zm107.2-255.2c0 67.1-72.4 68.1-72.4 92.9V300c0 6.6-5.4 12-12 12h-45.6c-6.6 0-12-5.4-12-12v-8.2c0-35.8 27.1-50.1 47.6-61.6 17.6-9.8 28.3-16.5 28.3-29.6 0-17.2-22-28.6-39.8-28.6-23.2 0-33.9 11-48.9 29.9-4 5.1-11.4 6-16.6 2.1l-27.8-21.1c-5.1-3.9-6.2-11.1-2.5-16.4C184.5 132.4 214.9 112 261.1 112c48.4 0 100.1 37.8 100.1 87.6zM298 368v46c0 6.6-5.4 12-12 12h-46c-6.6 0-12-5.4-12-12V368c0-6.6 5.4-12 12-12h46c6.6 0 12 5.4 12 12z",

      const icon = (which) =>
        `<svg class="fa-fw" viewBox="0 0 512 512" aria-hidden="true"><path d="${ICONS[which]}"/></svg>`;

      function esc(s) {
        return String(s ?? "").replace(
          /[&<>"']/g,

          (c) =>
            ({
              "&": "&amp;",

              "<": "&lt;",

              ">": "&gt;",

              '"': "&quot;",

              "'": "&#39;",
            })[c],
        );
      }

      /**
       * Calculate real contest progress from the contest start/end time.
       * This intentionally ignores the frozen state so the progress bar
       * continues moving normally while the scoreboard is frozen.
       */
      function contestProgressPercent(d) {
        const c = d.contest || {};
        const start = c.start ? new Date(c.start) : null;
        const durationMs = hmsToMs(c.duration);

        if (!start || durationMs === null || durationMs <= 0) return 0;

        const elapsedMs = Date.now() - start.getTime();

        return Math.max(0, Math.min(100, (elapsedMs / durationMs) * 100));
      }

      /**
       * Calculate the minutes remaining at the moment of the freeze.
       * contest.freeze is the elapsed contest time when the scoreboard froze.
       */
      function frozenRemainingMinutes(d) {
        const c = d.contest || {};
        const durationMs = hmsToMs(c.duration);
        const freezeMs = hmsToMs(c.freeze);

        if (durationMs === null || freezeMs === null) return null;

        return Math.ceil(Math.max(0, durationMs - freezeMs) / 60000);
      }

      function frozenBanner(d) {
        if (!d.frozen) return "";

        return `<div class="alert alert-warning" role="alert" style="font-size: 80%;">
            The scoreboard is frozen - solutions submitted during the frozen period are still shown as pending.
          </div>`;

        const remaining = frozenRemainingMinutes(d);

        if (remaining === null) {
          return `<div class="alert alert-warning" role="alert" style="font-size: 80%;">
            The scoreboard is frozen - solutions submitted during the frozen period are still shown as pending.
          </div>`;
        }

        const minuteWord = remaining === 1 ? "minute" : "minutes";

        return `<div class="alert alert-warning" role="alert" style="font-size: 80%;">
          The scoreboard was frozen with ${remaining} ${minuteWord} remaining -
          solutions submitted in the last ${remaining} ${minuteWord} of the contest are still shown as pending.
        </div>`;
      }

      function isContestEnded(d) {
        const c = d.contest || {};
        const start = c.start ? new Date(c.start) : null;
        const durationMs = hmsToMs(c.duration);

        if (!start || durationMs === null) return false;

        const end = start.getTime() + durationMs;

        return Date.now() >= end;
      }

      function render(vm, staleSince) {
        const progress = contestProgressPercent(vm.raw);
        const progressValue = progress.toFixed(3);

        return `

<div class="card">

    <div class="card-header" style="font-family: Roboto, sans-serif;">

        <div class="row">

            <div class="col-md-6 col-12">

                <span style="font-weight: bold;">${esc(vm.contestName)}</span>

            </div>

            <div class="col-md-6 col-12 text-md-end text-start">

                <span id="contesttimer">${esc(vm.timerText)}</span>

            </div>

        </div>

    </div>

    ${
      isContestEnded(vm.raw)
        ? ""
        : `
<div class="progress" style="margin-top:0px; height: 10px;" data-progress-bar="">
    <div class="progress-bar" role="progressbar"
         style="width: ${progressValue}%;"
         aria-valuenow="${progressValue}"
         aria-valuemin="0"
         aria-valuemax="100"></div>
</div>
`
    }
</div>

${frozenBanner(vm.raw)}

${staleSince ? staleBanner(staleSince) : ""}

${desktopTable(vm)}

${mobileTable(vm)}

${legend()}`;
      }

      function staleBanner(since) {
        return `<div class="alert alert-warning" style="padding:.4rem 1rem;margin:.5rem 0;font-size:.9rem;">

        ข้อมูลค้างตั้งแต่ ${esc(since)} — กำลังพยายามเชื่อมต่อใหม่

    </div>`;
      }

      function desktopTable(vm) {
        // showFlags=false, showAffiliationLogos=true, public=true, enable_ranking=true

        // teamColspan = 3 (ฐาน) + 1 (logos) = 4

        return `<table class="d-none d-md-table scoreboard desktop-scoreboard center">

    <colgroup>

        <col id="scorerank"/>

        <col/>

        <col id="scorelogos"/>

        <col id="scorehearts"/>

        <col id="scoreteamname"/>

    </colgroup>

    <colgroup>

        <col id="scoresolv"/>

        <col id="scoretotal"/>

    </colgroup>

    <colgroup>${vm.problems.map(() => '<col class="scoreprob"/>').join("")}</colgroup>

    <thead>

        <tr class="scoreheader" data-static="true">

            <th title="rank" scope="col">rank</th>

            <th title="team name" scope="col" colspan="4">team</th>

            <th title="# solved / penalty time" colspan="2" scope="col">score</th>

            ${vm.problems

              .map(
                (p) => `

            <th title="problem ${esc(p.name)}" scope="col"

                data-problem-id="${esc(p.id)}"

                data-problem-name="${esc(p.name)}">${problemBadge(p.label, p.rgb)}</th>`,
              )

              .join("")}

        </tr>

    </thead>

    <tbody>

        ${vm.rows

          .map(
            (row) => `

        <tr data-team-id="${esc(row.teamId)}" data-team-name="${esc(row.teamName)}">

            <td class="scorepl rank">${row.rank}</td>

            <td class="scoreaf"></td>

            <td class="scoreaf">${logoCell(row)}</td>

            <td class="scoreaf heart"></td>

            <td class="scoretn" title="${esc(row.teamName)}">

                <a>

                    <span class="forceWidth">${esc(row.teamName)}</span>

                    <span class="univ forceWidth">${esc(row.orgName)}</span>

                </a>

            </td>

            <td class="scorenc">${esc(row.numSolved)}</td>

            <td class="scorett">${esc(row.totalTime)}</td>

            ${row.cells.map(problemCellHtml).join("")}

        </tr>`,
          )

          .join("")}

        ${summaryRow(vm)}

    </tbody>

</table>`;
      }

      function problemCellHtml(cell) {
        if (!cell.hasSubmissions) return '<td class="score_cell"></td>';

        return (
          `<td class="score_cell"><a><div class="${cell.cssClass}">${cell.text}` +
          `<span>${esc(cell.tries)}</span></div></a></td>`
        );
      }

      function logoCell(row) {
        if (!row.logoHref) return "";

        return (
          `<a><img loading="lazy" class="affiliation-logo" src="${esc(row.logoHref)}"` +
          ` alt="${esc(row.orgName)}" title="${esc(row.orgName)}"></a>`
        );
      }

      function summaryRow(vm) {
        // summaryColspan = 2 + 1 (logos) + 1 (ranking) + 1 (public) = 5

        const cells = vm.summary.perProblem

          .map(
            (s) => `

        <td style="text-align: left;">

            <a>

                ${icon("up")}<span class="submcorrect" style="font-size:90%;" title="number of accepted submissions">${s.accepted}</span><br/>

                ${icon("down")}<span class="submreject" style="font-size:90%;" title="number of rejected submissions">${s.rejected}</span><br/>

                ${icon("q")}<span class="submpend" style="font-size:90%;" title="number of pending submissions">${s.pending}</span><br/>

                ${icon("clock")}<span style="font-size:90%;" title="first solved">${s.bestTime === null ? "n/a" : s.bestTime + "min"}</span>

            </a>

        </td>`,
          )

          .join("");

        return `

        <tr style="border-top: 2px solid black;">

            <td class="scoresummary" title="Summary" colspan="5">Summary</td>

            <td title="total solved" class="scorenc">${vm.summary.totalSolved}</td>

            <td></td>

            ${cells}

        </tr>`;
      }

      function mobileTable(vm) {
        // teamColspan (mobile) = 2 + 1 (logos) + 1 (public) = 4

        return `<table class="d-md-none scoreboard mobile-scoreboard center">

    <colgroup>

        <col id="scorerankmobile"/>

        <col/>

        <col id="scorelogosmobile"/>

        <col id="scoreheartmobile"/>

        <col id="scoreteamnamemobile"/>

    </colgroup>

    <colgroup><col id="scoresolvmobile"/></colgroup>

    <thead>

        <tr class="scoreheader" data-static="true" style="font-size: 75%;">

            <th title="rank" scope="col">rank</th>

            <th title="team name" scope="col" colspan="4">team</th>

            <th title="# solved / penalty time" colspan="1" scope="col">score</th>

        </tr>

    </thead>

    <tbody>

        ${vm.rows

          .map(
            (row) => `

        <tr data-team-id="${esc(row.teamId)}" data-team-name="${esc(row.teamName)}"

            style="border-bottom-width: 0; height: 28px;">

            <td class="scorepl"></td>

            <td class="scoreaf heart"></td>

            </td>

        </tr>

        <tr style="height: 32px;">

            <td><span class="rank">${row.rank}</span></td>

                <span class="mobile-problem-badges">

                    ${row.cells

                      .map((c, i) =>
                        problemBadge(
                          vm.problems[i] ? vm.problems[i].label : "?",

                          vm.problems[i] ? vm.problems[i].rgb : "#ffffff",

                          !c.hasSubmissions,
                        ),
                      )

                      .join(" ")}

                </span>

            </td>

        </tr>`,
          )

          .join("")}

    </tbody>

</table>`;
      }

      function legend() {
        const cellColors = [
          ["score_correct score_first", "Solved first"],

          ["score_correct", "Solved"],

          ["score_incorrect", "Tried, incorrect"],

          ["score_pending", "Tried, pending"],

          ["score_neutral", "Untried"],
        ];

        return `

<p><br/><br/></p>

<table id="cell_legend" class="d-none d-md-table scoreboard scorelegend">

    <thead><tr><th scope="col">Cell colours</th></tr></thead>

    <tbody>

    ${cellColors.map(([cls, label]) => `<tr class="${cls}"><td>${label}</td></tr>`).join("")}

    </tbody>

</table>`;
      }

      /* ==========================================================================

   ก้อนที่ 5 — poll(): จับเวลา จัดการ error / backoff

   ========================================================================== */

      const app = document.getElementById("app");

      const state = {
        lastVm: null,

        lastOkAt: null,

        backoffMs: CONFIG.refreshMs,

        timer: null,
      };

      function showFatal(message) {
        app.innerHTML = `<div class="alert alert-danger">

        <strong>โหลด scoreboard ไม่สำเร็จ</strong><br>${esc(message)}<br><br>

        <span style="font-size:.9rem;">

            แหล่งข้อมูลตอนนี้: <code>${esc(CONFIG.jsonUrl)}</code><br>

            ลองเปิดด้วย <code>?demo=1</code> เพื่อดูหน้าตาโดยไม่ต้องต่อ bridge

        </span>

    </div>`;
      }

      function paint(vm, staleSince) {
        state.lastVm = vm;

        app.innerHTML = render(vm, staleSince);

        markTooLong();
      }

      /**
       * Keep the progress bar moving every second.
       * This is independent from the 20-second scoreboard JSON refresh.
       */
      function updateProgressBar() {
        if (!state.lastVm || !state.lastVm.raw) return;

        const progress = contestProgressPercent(state.lastVm.raw);
        const value = progress.toFixed(3);
        const bar = document.querySelector("[data-progress-bar] .progress-bar");

        if (!bar) return;

        bar.style.width = `${value}%`;
        bar.setAttribute("aria-valuenow", value);
      }

      /** scoreboard_table.html.twig ท้ายไฟล์ — ใส่ .toolong ให้ชื่อที่ยาวเกินช่อง */

      function markTooLong() {
        document.querySelectorAll(".forceWidth:not(.toolong)").forEach((el) => {
          if (el.scrollWidth > el.offsetWidth) el.classList.add("toolong");
        });
      }

      async function tick() {
        try {
          const vm = normalize(await fetchScoreboard());

          state.lastOkAt = new Date();

          state.backoffMs = CONFIG.refreshMs;

          paint(vm, null);
        } catch (e) {
          // ห้ามล้างตาราง — หน้านี้ขึ้นจอโปรเจกเตอร์ คงชุดล่าสุดไว้แล้วถอยหลัง

          state.backoffMs = Math.min(state.backoffMs * 2, 120000);

          if (state.lastVm) {
            paint(
              state.lastVm,

              state.lastOkAt ? state.lastOkAt.toLocaleTimeString() : "—",
            );
          } else {
            showFatal(e.message);

            return;
          }
        } finally {
          clearTimeout(state.timer);

          state.timer = setTimeout(tick, state.backoffMs);
        }
      }

      window.addEventListener("resize", markTooLong);

      // The progress bar must continue moving even while the scoreboard is frozen.
      setInterval(updateProgressBar, 1000);

      app.innerHTML = '<p style="color:dimgrey;">กำลังโหลด scoreboard…</p>';

      tick();

      /* ==========================================================================

   Fixture สำหรับ ?demo=1 — schema เดียวกับ bridge เป๊ะ

   ครอบคลุม: ผ่าน / ผ่านครั้งแรก / ผิด / pending / ยังไม่ส่ง (td ต้องว่างสนิท)

             ทีมไม่มีโลโก้ / อันดับซ้ำ (ต้องซ่อนเลข) / time เป็น null

   ========================================================================== */
    </script>
